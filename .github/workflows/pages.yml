name: Site Lotigo
on:
  push:
    branches: [main]
    paths:
      - website/**
      - scripts/prepare-github-site.mjs
      - scripts/check-github-site.mjs
      - package.json
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
      - run: node --check website/app.js
      - run: node scripts/check-site-state.mjs
      - run: node scripts/check-github-site.mjs
      - run: node scripts/prepare-github-site.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: release/github-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
