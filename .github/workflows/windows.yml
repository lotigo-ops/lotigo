name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm.cmd ci
      - run: npm.cmd test
      - run: npm.cmd run dist
      - uses: actions/upload-artifact@v4
        with:
          name: lotigo-windows
          path: release/*Setup.exe
          if-no-files-found: error
